<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ciudadan Media Player</title>
<style>
  /* Barra de control estilo YouTube: overlay flotante sobre el vídeo, con scrim,
     progreso rojo, vista previa del tiempo, lista lateral con scroll y modal de
     búsqueda. El fondo es transparente para que se vea el vídeo. */
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;
    font-family:'Roboto','Segoe UI',Arial,sans-serif;color:#fff;cursor:default}
  #scrim{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;
    background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.45) 45%,rgba(0,0,0,0) 100%);
    opacity:1;transition:opacity .25s ease}
  #bar{position:absolute;left:10px;right:10px;bottom:10px;height:52px;box-sizing:border-box;
    display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:12px;
    background:rgba(24,24,26,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 2px 14px rgba(0,0,0,.45);opacity:1;transform:translateY(0);
    transition:opacity .22s ease,transform .22s ease}
  body.hidden #scrim{opacity:0}
  body.hidden #bar{opacity:0;transform:translateY(12px);pointer-events:none}

  button{background:none;border:0;color:#fff;cursor:pointer;padding:0;display:flex;
    align-items:center;justify-content:center;border-radius:50%;opacity:.92}
  button:hover{opacity:1}
  button svg{width:23px;height:23px;fill:currentColor;display:block}
  #play svg{width:26px;height:26px}
  .ic{width:34px;height:34px}
  .ic:disabled{opacity:.35;cursor:default}

  #cur,#tot{font-size:12px;color:#e8e8e8;font-variant-numeric:tabular-nums;opacity:.95;white-space:nowrap}
  #tot{color:#bdbdbd;margin-left:2px}

  /* barra de progreso */
  #track{position:relative;flex:1;height:18px;display:flex;align-items:center;cursor:pointer;min-width:60px}
  #rail{position:relative;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.28);overflow:visible}
  #played{position:absolute;left:0;top:0;bottom:0;background:#ff0000;border-radius:2px;width:0}
  #knob{position:absolute;top:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;
    background:#ff0000;transform:translateY(-50%) scale(0);transition:transform .12s ease;
    box-shadow:0 0 4px rgba(0,0,0,.5)}
  #track:hover #knob{transform:translateY(-50%) scale(1)}
  #tip{position:absolute;bottom:26px;transform:translateX(-50%);background:rgba(0,0,0,.85);
    color:#fff;font-size:12px;padding:3px 7px;border-radius:4px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .1s}
  #track:hover #tip{opacity:1}

  /* volumen */
  #volGroup{display:flex;align-items:center;gap:6px}
  #vol{width:0;opacity:0;transition:width .18s ease,opacity .18s ease;accent-color:#fff;
    -webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.4);outline:none}
  #volGroup:hover #vol,#vol:focus{width:76px;opacity:1}
  #vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}

  #right{display:flex;align-items:center;gap:2px;margin-left:auto}
  #spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#ff0000;
    border-radius:50%;animation:sp .8s linear infinite;display:none}
  body.buffering #spin{display:block}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---- Lista lateral con scroll ---- */
  #playlist{position:absolute;left:0;top:0;width:300px;height:auto;max-height:calc(100% - 20px);
    background:rgba(18,18,20,.94);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;flex-direction:column;
    border-right:1px solid rgba(255,255,255,.08);box-shadow:4px 0 18px rgba(0,0,0,.5)}
  body.showPlaylist #playlist{display:flex}
  #plHead{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
  #plHead h3{margin:0;font-size:13px;font-weight:600;flex:1}
  #plList{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 0;max-height:300px}
  #plList::-webkit-scrollbar{width:8px}
  #plList::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:4px}
  #plList::-webkit-scrollbar-track{background:transparent}
  .plItem{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;cursor:pointer;line-height:1.3}
  .plItem:hover{background:rgba(255,255,255,.08)}
  .plItem.current{background:rgba(255,0,0,.16);box-shadow:inset 3px 0 0 #ff0000}
  .plItem .n{width:18px;text-align:right;color:#aaa;font-size:11px;padding-top:2px}
  .plItem.current .n{color:#ff5555}
  .plItem .t{flex:1;min-width:0}
  .plItem .t b{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plItem .t span{font-size:11px;color:#9a9aa4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  #plEmpty{padding:16px;font-size:12px;color:#8a8a94}

  /* ---- Explorador multimedia (buscador + resultados + cola + listas) ----
     El contenido lo construye renderer/search/explorer.js (módulo reutilizable
     para la futura página de inicio de Ciudadan Media). */
  #modal{position:absolute;inset:0;display:none;pointer-events:none}
  body.showModal #modal{display:block;pointer-events:auto}
  body.showModal #playlist{display:none}
</style>
</head>
<body>
  <div id="scrim"></div>

  <!-- panel lateral: listas reales del usuario (Favoritos, Ver más tarde, etc.) -->
  <aside id="playlist">
    <div id="plHead">
      <h3 id="plTitle">Mis listas</h3>
      <button id="plBack" class="ic" title="Volver a las listas" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <button id="plClose" class="ic" title="Cerrar la lista">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div id="plList"></div>
  </aside>

  <!-- modal de búsqueda: ahora es el explorador multimedia -->
  <div id="modal">
    <div id="explorer">
      <div id="exRoot"></div>
    </div>
  </div>

  <div id="bar">
    <button id="prev" class="ic" title="Anterior (lista)">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg>
    </button>
    <button id="play" class="ic" title="Reproducir / pausar (espacio)">
      <svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button id="stop" class="ic" title="Detener">
      <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
    </button>
    <button id="next" class="ic" title="Siguiente (lista)">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
    <div id="volGroup">
      <button id="volBtn" class="ic" title="Silenciar / restaurar (M)">
        <svg id="icoVol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <svg id="icoMute" viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm18.6 3l2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/></svg>
      </button>
      <input id="vol" type="range" min="0" max="100" value="100" title="Volumen">
    </div>
    <span id="cur">0:00</span>
    <div id="track" title="Ir a">
      <div id="rail"><div id="played"></div><div id="knob"></div></div>
      <div id="tip">0:00</div>
    </div>
    <span id="tot">0:00</span>
    <div id="right">
      <div id="spin"></div>
      <button id="search" class="ic" title="Buscar / cargar URL">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14"/></svg>
      </button>
      <button id="plToggle" class="ic" title="Lista de reproducción">
        <svg viewBox="0 0 24 24"><path d="M3 10h12v2H3zm0-4h12v2H3zm0 8h8v2H3zm14-4v6.18a3 3 0 1 0 2 2.82V8h3V6h-5z"/></svg>
      </button>
      <button id="full" class="ic" title="Pantalla completa (F)">
        <svg id="icoFull" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <svg id="icoExit" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
      </button>
    </div>
  </div>
<link rel="stylesheet" href="search/explorer.css">
<script src="search/explorer-utils.js"></script>
<script src="search/explorer-results.js"></script>
<script src="search/explorer-lists.js"></script>
<script src="search/explorer.js"></script>
<script src="yt-controls.js"></script>
</body>
</html>
